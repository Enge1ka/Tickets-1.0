<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="admin-nav"></div>

    <div class="container mt-4">
        <h1>Settings</h1>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <h3>Manage Departments</h3>
                <div id="department-list" class="list-group mb-3"></div>
            </div>
            <div class="col-md-6">
                <h4>Add New Department</h4>
                <form id="create-department-form">
                    <div class="mb-3">
                        <label for="new-department-name" class="form-label">Department Name</label>
                        <input type="text" id="new-department-name" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Department</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="settings.js"></script>
</body>
</html>
