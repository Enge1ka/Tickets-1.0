<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="admin-nav"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>User Management</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#create-user-modal">Add New User</button>
        </div>
        <div id="user-list" class="list-group"></div>
    </div>

    <!-- Create User Modal -->
    <div class="modal fade" id="create-user-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-user-form">
                        <div class="mb-3">
                            <label for="new-username" class="form-label">Username</label>
                            <input type="text" id="new-username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="new-password" class="form-label">Password</label>
                            <input type="password" id="new-password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="new-role" class="form-label">Role</label>
                            <select id="new-role" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="new-department" class="form-label">Department</label>
                            <select id="new-department" class="form-select" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="edit-user-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-user-form">
                        <input type="hidden" id="edit-user-id">
                        <div class="mb-3">
                            <label for="edit-username" class="form-label">Username</label>
                            <input type="text" id="edit-username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-password" class="form-label">New Password (optional)</label>
                            <input type="password" id="edit-password" class="form-control" placeholder="Leave blank to keep current password">
                        </div>
                        <div class="mb-3">
                            <label for="edit-role" class="form-label">Role</label>
                            <select id="edit-role" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="edit-department" class="form-label">Department</label>
                            <select id="edit-department" class="form-select" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="users.js"></script>
</body>
</html>
