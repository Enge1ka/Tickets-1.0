<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="admin-nav"></div>

    <div class="container mt-4">
        <h1 class="mb-4">Dashboard</h1>

        <!-- Tabs -->
        <ul class="nav nav-tabs" id="dashboard-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tickets-tab" data-bs-toggle="tab" data-bs-target="#tickets-panel" type="button" role="tab">Tickets</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="requisitions-tab" data-bs-toggle="tab" data-bs-target="#requisitions-panel" type="button" role="tab">Requisitions</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="knowledge-base-admin-tab" data-bs-toggle="tab" data-bs-target="#knowledge-base-admin-panel" type="button" role="tab">Knowledge Base</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="dashboard-tabs-content">
            <!-- Tickets Panel -->
            <div class="tab-pane fade show active" id="tickets-panel" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
                    <h3>All Tickets</h3>
                    <input type="text" id="ticket-search" class="form-control w-25" placeholder="Search tickets...">
                </div>
                <div id="ticket-list" class="list-group"></div>
            </div>
            <!-- Requisitions Panel -->
            <div class="tab-pane fade" id="requisitions-panel" role="tabpanel">
                 <h3 class="mt-3">All Requisitions</h3>
                 <div id="requisition-list" class="list-group mt-3"></div>
            </div>
            <!-- Knowledge Base Admin Panel -->
            <div class="tab-pane fade" id="knowledge-base-admin-panel" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
                    <h3>Knowledge Base Management</h3>
                    <button class="btn btn-primary" onclick="showCreateArticleModal()">Create Article</button>
                </div>
                <div id="kb-admin-list" class="list-group"></div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Article Modal -->
    <div class="modal fade" id="articleModal" tabindex="-1" aria-labelledby="articleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="articleModalLabel">Create Article</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="article-form">
                        <input type="hidden" id="article-id">
                        <div class="mb-3">
                            <label for="article-title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="article-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="article-category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="article-category" required>
                        </div>
                        <div class="mb-3">
                            <label for="article-tags" class="form-label">Tags</label>
                            <input type="text" class="form-control" id="article-tags" placeholder="Separate with commas">
                        </div>
                        <div class="mb-3">
                            <label for="article-content" class="form-label">Content</label>
                            <textarea class="form-control" id="article-content" rows="10" required></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="article-public" checked>
                            <label class="form-check-label" for="article-public">
                                Public (visible to all users)
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveArticle()">Save Article</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
