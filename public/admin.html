<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Dashboard</a>
            <a href="/" class="btn btn-sm btn-outline-light">User View</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Stats Section -->
        <div class="row text-center mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Open Tickets</h5>
                        <p class="card-text fs-2" id="stats-open-tickets">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Critical Priority</h5>
                        <p class="card-text fs-2 text-danger" id="stats-critical-tickets">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">High Priority</h5>
                        <p class="card-text fs-2 text-warning" id="stats-high-tickets">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Pending Requisitions</h5>
                        <p class="card-text fs-2" id="stats-pending-reqs">0</p>
                    </div>
                </div>
            </div>
        </div>

        <hr>

        <!-- Ticket Management -->
        <!-- Reports Section -->
        <div class="my-4 p-3 bg-light rounded">
            <h4>Download Reports</h4>
            <a href="/api/reports/tickets/csv" class="btn btn-secondary">Download Tickets (CSV)</a>
            <a href="/api/reports/tickets/pdf" class="btn btn-secondary">Download Tickets (PDF)</a>
        </div>

        <h2 class="mt-4">Manage Tickets</h2>
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="ticket-search" class="form-control" placeholder="Search tickets by title...">
            </div>
            <div class="col-md-3">
                <select id="ticket-filter-status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
        </div>
        <div id="admin-ticket-list" class="list-group"></div>

        <hr class="my-5">

        <!-- Requisition Management -->
        <h2 class="mt-4">Manage Requisitions</h2>
        <div id="admin-requisition-list" class="list-group"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
