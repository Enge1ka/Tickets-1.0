<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticketing & Requisition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Ticketing & Requisition Service</a>
            <button id="logout-btn" class="btn btn-outline-light">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Ticket Creation Form -->
            <div class="col-md-4">
                <h2>Log an Issue</h2>
                <form id="ticket-form">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="Software Issue">Software Issue</option>
                            <option value="Hardware Issue">Hardware Issue</option>
                            <option value="Network">Network</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority</label>
                        <select class="form-select" id="priority" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                </form>
            </div>

            <!-- Ticket and Requisition Display -->
            <div class="col-md-8">
                <!-- Tabs -->
                <ul class="nav nav-tabs" id="user-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="active-tickets-tab" data-bs-toggle="tab" data-bs-target="#active-tickets-panel" type="button" role="tab">My Active Tickets</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="resolved-tickets-tab" data-bs-toggle="tab" data-bs-target="#resolved-tickets-panel" type="button" role="tab">My History</button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="user-tabs-content">
                    <!-- Active Tickets Panel -->
                    <div class="tab-pane fade show active" id="active-tickets-panel" role="tabpanel">
                        <div id="ticket-list" class="list-group mt-3"></div>
                    </div>
                    <!-- Resolved Tickets Panel -->
                    <div class="tab-pane fade" id="resolved-tickets-panel" role="tabpanel">
                         <div id="resolved-ticket-list" class="list-group mt-3"></div>
                    </div>
                </div>

                <hr class="my-5">

                <h2>My Requisitions</h2>
                <div id="requisition-list" class="list-group">
                    <!-- Requisitions will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <!-- Requisition Form -->
            <div class="col-md-4">
                <h2>Submit a Requisition</h2>
                <form id="requisition-form">
                    <div class="mb-3">
                        <label for="item" class="form-label">Item Requested</label>
                        <input type="text" class="form-control" id="item" placeholder="e.g., Wireless Mouse" required>
                    </div>
                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="quantity" value="1" min="1" required>
                    </div>
                     <div class="mb-3">
                        <label for="reason" class="form-label">Reason</label>
                        <textarea class="form-control" id="reason" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="urgency" class="form-label">Urgency</label>
                        <select class="form-select" id="urgency" required>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Submit Request</button>
                </form>
            </div>

            <!-- Requisition List -->
            <div class="col-md-8">
                <h2>My Requisitions</h2>
                <div id="requisition-list" class="list-group">
                    <!-- Requisitions will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
